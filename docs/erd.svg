<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
  <rect width="1180" height="620" fill="#ffffff"/>
  <style>.box{fill:#f8fafc;stroke:#334155;stroke-width:2}.head{font:700 20px Arial;fill:#0f172a}.field{font:15px monospace;fill:#334155}.line{stroke:#64748b;stroke-width:2;fill:none}.caption{font:14px Arial;fill:#334155}</style>
  <g class="line"><path d="M280 153 H470 V144 H535"/><path d="M280 190 H470 V310 H535"/><path d="M800 150 H950 V330"/><path d="M800 320 H950"/><path d="M280 390 H535"/><path d="M280 495 H535"/></g>
  <g><rect class="box" x="28" y="40" width="252" height="210" rx="9"/><text class="head" x="45" y="70">User</text><text class="field" x="45" y="102">id (PK)</text><text class="field" x="45" y="125">email (unique)</text><text class="field" x="45" y="148">first_name / last_name</text><text class="field" x="45" y="171">is_active / is_staff</text><text class="field" x="45" y="194">is_superuser</text></g>
  <g><rect class="box" x="535" y="40" width="265" height="260" rx="9"/><text class="head" x="553" y="71">Post</text><text class="field" x="553" y="101">id (PK)</text><text class="field" x="553" y="124">author_id (FK → User)</text><text class="field" x="553" y="147">category_id (FK, null)</text><text class="field" x="553" y="170">title / slug / body</text><text class="field" x="553" y="193">status (draft/published)</text><text class="field" x="553" y="216">created_at / updated_at</text><text class="field" x="553" y="239">tags (M:N via join)</text></g>
  <g><rect class="box" x="28" y="330" width="252" height="142" rx="9"/><text class="head" x="45" y="360">Category</text><text class="field" x="45" y="393">id (PK)</text><text class="field" x="45" y="416">name (unique)</text><text class="field" x="45" y="439">slug (unique)</text></g>
  <g><rect class="box" x="28" y="495" width="252" height="100" rx="9"/><text class="head" x="45" y="528">Tag</text><text class="field" x="45" y="552">id / name / slug</text></g>
  <g><rect class="box" x="910" y="330" width="245" height="170" rx="9"/><text class="head" x="930" y="360">Comment</text><text class="field" x="930" y="391">id (PK)</text><text class="field" x="930" y="414">post_id (FK → Post)</text><text class="field" x="930" y="437">author_id (FK → User)</text><text class="field" x="930" y="460">body / created_at</text></g>
  <text class="caption" x="340" y="130">1:N author</text><text class="caption" x="339" y="327">1:N category</text><text class="caption" x="342" y="482">M:N tags</text><text class="caption" x="834" y="300">1:N post</text>
</svg>
